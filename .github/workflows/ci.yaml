name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  markdown:
    name: 📝 Markdown Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !CHANGELOG.md
            !node_modules/**
          config: 'config/custom.markdownlint.jsonc'
  spelling:
    name: ✍️ Spelling Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Spell Check
        uses: streetsidesoftware/cspell-action@v9
        with:
          files: |
            **/*.md
            !CHANGELOG.md
          config: 'config/cspell.json'
          incremental_files_only: false
  hooks:
    name: 🪝 Hook Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x -P SCRIPTDIR hooks/scripts/*.sh scripts/*.sh skills/shared/scripts/*.sh
      - name: Run hook tests
        run: bash hooks/scripts/hooks_test.sh
  manifest:
    name: 📦 Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate plugin manifest
        run: bash ./scripts/validate_plugin_manifest.sh
      - name: Validate marketplace JSON
        run: jq empty .claude-plugin/marketplace.json && jq empty hooks/hooks.json && jq empty .mcp.json
  plugin-validate:
    name: 🔍 Plugin Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate Plugin
        run: claude plugin validate .
  detect-changed-skills:
    name: 🔎 Detect Changed Skills
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.changed-skills.outputs.skills }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get changed skills
        id: changed-skills
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          SKILLS=$(git diff --name-only --diff-filter=d $BASE $HEAD | \
            { grep 'SKILL.md' || true; } | \
            xargs -I {} dirname {} | \
            sort -u | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "skills=$SKILLS" >> "$GITHUB_OUTPUT"
          echo "Changed skills: $SKILLS"
  validate-skills:
    name: ✅ Validate Skills
    needs: detect-changed-skills
    if: needs.detect-changed-skills.outputs.skills != '[]' && needs.detect-changed-skills.outputs.skills != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.detect-changed-skills.outputs.skills) }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate ${{ matrix.skill }}
        uses: Flash-Brew-Digital/validate-skill@v1
        with:
          path: ${{ matrix.skill }}
          validate-references: 'true'
          fail-on-warning: 'true'
          ignore-rules: 'name-match-directory,unknown-field'
